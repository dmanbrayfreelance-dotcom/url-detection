<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrackPhish Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 380px;
      background-color: #0d1322;
      color: #f3f4f6;
      padding: 16px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f293d;
      margin-bottom: 12px;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 13px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .subtitle {
      font-size: 10px;
      color: #94a3b8;
    }
    .badge-pill {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0369a1;
      color: #e0f2fe;
      font-weight: 600;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
      display: block;
    }
    .url-input {
      width: 100%;
      background: #070a12;
      border: 1px solid #27354f;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      outline: none;
    }
    .url-input:focus {
      border-color: #38bdf8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #0284c7;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
    .result-card {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 8px;
      padding: 12px;
      display: none;
      margin-bottom: 12px;
    }
    .verdict-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .verdict-badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
    }
    .badge-phish {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }
    .badge-safe {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .tokens-container {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .token-chip {
      font-family: monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .token-critical {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      padding-top: 8px;
      border-top: 1px solid #1f293d;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <div class="logo-badge">🛡️</div>
      <div>
        <div class="title">TrackPhish Enhanced</div>
        <div class="subtitle">Zero-Live-Visit Phishing URL Shield</div>
      </div>
    </div>
    <div class="badge-pill">IEEE TIFS 2025</div>
  </div>

  <div class="input-group">
    <label class="input-label">URL to Inspect</label>
    <input type="text" id="targetUrl" class="url-input" placeholder="https://..." />
  </div>

  <div class="btn-row">
    <button id="scanCurrentTabBtn" class="btn btn-secondary">Use Current Tab</button>
    <button id="scanBtn" class="btn btn-primary">Scan URL</button>
  </div>

  <div id="resultCard" class="result-card">
    <div class="verdict-header">
      <span id="verdictBadge" class="verdict-badge">SCANNING...</span>
      <span id="probText" style="font-family: monospace; font-weight: bold;">0.0%</span>
    </div>

    <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">
      Latency: <strong id="latencyText" style="color: #38bdf8;">-- ms</strong> | Mode: <strong id="modeText">--</strong>
    </div>

    <div id="indicatorsList" style="font-size: 10px; color: #fca5a5; margin-bottom: 8px;"></div>

    <div style="font-size: 10px; color: #cbd5e1; font-weight: 600; margin-bottom: 4px;">
      Attention Highlighted Tokens:
    </div>
    <div id="tokensContainer" class="tokens-container"></div>
  </div>

  <div class="footer">
    Multi-Embedding Scaled Dot-Product Attention 1D CNN
  </div>

  <script src="popup.js"></script>
</body>
</html>
